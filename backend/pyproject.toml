[project]
name = "garmin-coach-backend"
version = "0.1.0"
description = "Garmin running coach — Telegram Mini App backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiogram>=3.15",
    "garminconnect>=0.2.19",
    "openai>=1.60",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "markdown>=3.7",
    "timezonefinder>=6.5",
]

[tool.setuptools]
packages = ["app"]
